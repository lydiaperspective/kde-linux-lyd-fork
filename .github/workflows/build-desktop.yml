
name: Build desktop image

on:
  push:
    branches: [nvidia580xx-legacy]

  schedule:
    - cron: '0 7 * * 0' # Weekly, KDE package snapshots can change independently

  workflow_dispatch:
    inputs:
      upload_iso:
        description: Also publish the ISO (large)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-desktop
  cancel-in-progress: false

jobs:
  build:
    # Self-hosted runner on lyd-opti.
    # Only runs code from this repository's own branch.
    runs-on: [self-hosted, lyd-opti]

    timeout-minutes: 360

    env:
      # Existing signing key imported from the old Podman volume.
      SIGN_GNUPGHOME: /var/lib/github-runner/gnupg

      # Host directory served by Caddy.
      DEST: /srv/artifacts

      # Retain the newest four builds.
      KEEP: 4

    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2
        with:
          ref: nvidia580xx-legacy
          clean: false # Keep build cache and downloaded sources between runs.

      - name: Export public signing key
        run: |
          set -euo pipefail

          SIGN_KEY="$(cat "$SIGN_GNUPGHOME/signing-key-fingerprint")"

          mkdir -p .secure_files

          gpg --homedir "$SIGN_GNUPGHOME" \
            --batch \
            --export --armor "$SIGN_KEY" \
            > .secure_files/gpg.public.key

          test -s .secure_files/gpg.public.key

      - name: Build image
        run: |
          set -euo pipefail

          rm -rf mkosi.output

          sudo -n ./build_docker.sh --podman

      - name: Sign and publish to home server
        env:
          UPLOAD_ISO: ${{ inputs.upload_iso && '1' || '0' }}
        run: |
          set -euo pipefail

          .github/scripts/publish.sh
