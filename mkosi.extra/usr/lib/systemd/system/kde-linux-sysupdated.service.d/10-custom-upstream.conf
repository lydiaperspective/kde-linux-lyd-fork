# Point the delta-update daemon at the self-hosted update server instead of KDE's.
# Host root only: the path (/<variant>/sysupdate/v2/) comes from the erofs .transfer file.
[Service]
Environment=KDE_LINUX_SYSUPDATED_BASE_URL=https://kdeup.taild6fd2b.ts.net/
